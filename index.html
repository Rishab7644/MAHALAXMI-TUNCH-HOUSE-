<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mahalaxmi Tunch House - Gold Bill</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f2f2f2;
  padding:15px;
}
.container{
  max-width:500px;
  margin:auto;
  background:white;
  padding:20px;
  border-radius:12px;
  box-shadow:0 2px 10px #bbb;
}
h1{text-align:center;font-size:23px;margin:5px 0}
h2{text-align:center;font-size:15px;font-weight:normal;margin:5px 0 20px}
label{display:block;font-weight:bold;margin-top:12px}
input{
  width:100%;
  padding:12px;
  margin-top:5px;
  border:1px solid #bbb;
  border-radius:6px;
  font-size:16px;
}
.result{
  margin-top:20px;
  padding:15px;
  background:#f7f7f7;
  border:1px solid #ddd;
  border-radius:8px;
}
.row{
  display:flex;
  justify-content:space-between;
  padding:6px 0;
}
button{
  width:100%;
  padding:13px;
  margin-top:15px;
  border:0;
  border-radius:7px;
  font-size:17px;
  font-weight:bold;
  background:#222;
  color:white;
}
.print{background:#198754}
.clear{background:#dc3545}
.cash{
  font-size:18px;
  font-weight:bold;
}
@media print{
  body{background:white;padding:0}
  .container{box-shadow:none;width:100%;max-width:80mm;padding:5px}
  .no-print{display:none}
  h1{font-size:18px}
  h2{font-size:12px}
  .result{border:0;background:white}
}
</style>
</head>

<body>

<div class="container">

  <h1>MAHALAXMI TUNCH HOUSE</h1>
  <h2>GOLD TESTING RECEIPT</h2>

  <div class="no-print">

    <label>Customer Name</label>
    <input id="customer" type="text" placeholder="Customer ka naam">

    <label>Date</label>
    <input id="date" type="date">

    <label>Gold Weight (gram)</label>
    <input id="weight" type="number" step="0.001" placeholder="Example: 10.000" oninput="calculate()">

    <label>Purity (%)</label>
    <input id="purity" type="number" step="0.01" placeholder="Example: 91.60" oninput="calculate()">

    <label>Gold Rate ₹/gram (optional)</label>
    <input id="rate" type="number" step="0.01" placeholder="Cash calculation ke liye" oninput="calculate()">

    <label>Actual Fine (optional)</label>
    <input id="actualFine" type="number" step="0.001" placeholder="Agar difference check karna ho" oninput="calculate()">

  </div>

  <div class="result">

    <div class="row">
      <span>Customer:</span>
      <b id="showCustomer">-</b>
    </div>

    <div class="row">
      <span>Date:</span>
      <b id="showDate">-</b>
    </div>

    <hr>

    <div class="row">
      <span>Gold Weight:</span>
      <b id="showWeight">0.000 g</b>
    </div>

    <div class="row">
      <span>Purity:</span>
      <b id="showPurity">0.00 %</b>
    </div>

    <div class="row">
      <span>Fine @ 99.50:</span>
      <b id="fine">0.000 g</b>
    </div>

    <div id="differenceBox" style="display:none">
      <hr>

      <div class="row">
        <span>Actual Fine:</span>
        <b id="showActual">0.000 g</b>
      </div>

      <div class="row">
        <span>Difference:</span>
        <b id="difference">0.000 g</b>
      </div>

      <div class="row cash">
        <span id="cashLabel">Cash:</span>
        <b id="cash">₹0.00</b>
      </div>
    </div>

  </div>

  <div class="no-print">
    <button class="print" onclick="window.print()">🖨️ PRINT BILL</button>
    <button class="clear" onclick="clearBill()">CLEAR</button>
  </div>

</div>

<script>

const today = new Date();
document.getElementById("date").value =
  today.toISOString().split("T")[0];

function calculate(){

  let customer = document.getElementById("customer").value;
  let date = document.getElementById("date").value;
  let weight = parseFloat(document.getElementById("weight").value) || 0;
  let purity = parseFloat(document.getElementById("purity").value) || 0;
  let rate = parseFloat(document.getElementById("rate").value) || 0;
  let actual = parseFloat(document.getElementById("actualFine").value);

  // Fine calculation
  let fine = (weight * purity) / 99.50;

  document.getElementById("showCustomer").innerText =
    customer || "-";

  document.getElementById("showDate").innerText =
    date || "-";

  document.getElementById("showWeight").innerText =
    weight.toFixed(3) + " g";

  document.getElementById("showPurity").innerText =
    purity.toFixed(2) + " %";

  document.getElementById("fine").innerText =
    fine.toFixed(3) + " g";

  // Actual Fine diya hai to difference/cash
  if(!isNaN(actual) && actual > 0){

    let diff = actual - fine;
    let cash = Math.abs(diff) * rate;

    document.getElementById("differenceBox").style.display = "block";

    document.getElementById("showActual").innerText =
      actual.toFixed(3) + " g";

    document.getElementById("difference").innerText =
      (diff >= 0 ? "+" : "") + diff.toFixed(3) + " g";

    if(diff > 0){
      document.getElementById("cashLabel").innerText =
        "Cash Dena:";
    }
    else if(diff < 0){
      document.getElementById("cashLabel").innerText =
        "Cash Lena:";
    }
    else{
      document.getElementById("cashLabel").innerText =
        "Cash Difference:";
    }

    document.getElementById("cash").innerText =
      "₹" + cash.toFixed(2);

  }else{

    document.getElementById("differenceBox").style.display = "none";

  }
}

function clearBill(){

  document.getElementById("customer").value="";
  document.getElementById("weight").value="";
  document.getElementById("purity").value="";
  document.getElementById("rate").value="";
  document.getElementById("actualFine").value="";

  calculate();
}

document.getElementById("customer").addEventListener("input",calculate);
document.getElementById("date").addEventListener("change",calculate);

</script>

</body>
</html>
